[base]
id = 1
name = "linux-qemu-noblk"
vm_type = 1
cpu_num = 1
phys_cpu_ids = [0]

[kernel]
entry_point = 0x9020_0000
image_location = "fs"
kernel_path = "/guest/qemu-riscv64"
kernel_load_addr = 0x9020_0000
dtb_load_addr = 0x93f0_0000
cmdline = "earlycon=sbi console=ttyS0,115200 root=/dev/vda rw rootwait devtmpfs.mount=1 init=/init"

memory_regions = [[0x9000_0000, 0x4000_0000, 0x7, 1]]

[devices]
interrupt_mode = "passthrough"

passthrough_devices = [["/soc/serial@10000000"]]

passthrough_addresses = [[0x1000_0000, 0x100]]

excluded_devices = []

emu_devices = [["plic", 0x0c00_0000, 0x60_0000, 0, 0x30, [2]]]
